[project]
name = "bharatvitals-mcp"
version = "0.1.0"
description = "MCP server for BharatVitals — AI-accessible India public health data"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["mcp", "india", "public-health", "hmis", "bharatvitals"]
dependencies = [
    "fastmcp>=2.0",
    "httpx>=0.27",
]

[project.scripts]
bharatvitals-mcp = "bharatvitals.server:main"

[project.urls]
Homepage = "https://github.com/saketlab/bharatvitals"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bharatvitals"]

[tool.pyright]
venvPath = "."
venv = ".venv"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
