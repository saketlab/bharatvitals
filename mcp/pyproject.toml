[project]
name = "bharatpulse-mcp"
version = "0.1.0"
description = "MCP server for BharatPulse — AI-accessible India public health data"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["mcp", "india", "public-health", "hmis", "bharatpulse"]
dependencies = [
    "fastmcp>=2.0",
    "httpx>=0.27",
]

[project.scripts]
bharatpulse-mcp = "bharatpulse.server:main"

[project.urls]
Homepage = "https://github.com/saketlab/bharatpulse"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bharatpulse"]

[tool.pyright]
venvPath = "."
venv = ".venv"
