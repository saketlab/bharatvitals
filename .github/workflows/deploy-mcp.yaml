on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mcp/**'
      - '.github/services/bharatvitals-mcp.service'
      - '.github/workflows/deploy-mcp.yaml'

name: deploy-bharatvitals-mcp

concurrency:
  group: deploy-bharatvitals-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - name: SSH redeploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script_stop: true
          script: |
            set -euo pipefail
            # one-time with the unit block below, delete after first deploy; mv keeps repo auth
            if [ ! -d "$HOME/bharatvitals" ] && [ -d "$HOME/bharatpulse/.git" ]; then
              mv "$HOME/bharatpulse" "$HOME/bharatvitals"
              rm -rf "$HOME/bharatvitals/.venv"   # its scripts point at the old path
              git -C "$HOME/bharatvitals" remote set-url origin \
                "$(git -C "$HOME/bharatvitals" remote get-url origin | sed 's/bharatpulse/bharatvitals/')"
            fi
            [ -d "$HOME/bharatvitals" ] || git clone https://github.com/saketlab/bharatvitals.git "$HOME/bharatvitals"
            cd ~/bharatvitals
            git fetch --prune
            git reset --hard origin/main
            if ! command -v uv >/dev/null 2>&1; then
              [ -x "$HOME/.local/bin/uv" ] || curl -LsSf https://astral.sh/uv/install.sh | sh
              export PATH="$HOME/.local/bin:$PATH"
            fi
            [ -d .venv ] || uv venv .venv --python 3.11
            uv pip install --python .venv/bin/python -e ./mcp
            # one-time: the old unit holds port 9000
            if [ -f "$HOME/.config/systemd/user/bharatpulse-mcp.service" ]; then
              systemctl --user disable --now bharatpulse-mcp.service || true
              rm -f "$HOME/.config/systemd/user/bharatpulse-mcp.service"
              systemctl --user daemon-reload
              systemctl --user reset-failed bharatpulse-mcp.service 2>/dev/null || true
            fi
            install -D -m 644 .github/services/bharatvitals-mcp.service \
                    "$HOME/.config/systemd/user/bharatvitals-mcp.service"
            systemctl --user daemon-reload
            systemctl --user enable bharatvitals-mcp.service
            systemctl --user restart bharatvitals-mcp.service
            for i in $(seq 1 60); do
              code=$(curl -s -o /dev/null -m 5 -w '%{http_code}' \
                -H 'Accept: application/json, text/event-stream' \
                http://127.0.0.1:9000/mcp || true)
              case "$code" in 200|400|406) echo "mcp healthy after ${i}s (status $code)"; exit 0 ;; esac
              sleep 1
            done
            echo "mcp did not become healthy in 60s" >&2
            journalctl --user -u bharatvitals-mcp.service -n 50 --no-pager >&2 || true
            exit 1
